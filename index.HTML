<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guia de Segurança Digital - Terceira Idade</title>
    <style>
        /* --- ESTILOS DE ACESSIBILIDADE E DESIGN --- */
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            font-size: 22px; /* Fonte ampliada por padrão */
            line-height: 1.6;
            background-color: #F4F6F8;
            color: #1A1A1A; /* Alto contraste com o fundo */
            padding: 20px;
        }

        /* Cabeçalho */
        header {
            background-color: #004080; /* Azul escuro acessível */
            color: #FFFFFF;
            padding: 30px 20px;
            text-align: center;
            border-radius: 12px;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 36px;
            margin-bottom: 10px;
        }

        /* Container Principal */
        main {
            max-width: 900px;
            margin: 0 auto;
        }

        /* Cartões de Dicas */
        .card-dica {
            background-color: #FFFFFF;
            border: 3px solid #004080; /* Borda bem visível */
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .card-dica h2 {
            color: #004080;
            font-size: 28px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card-dica p {
            margin-bottom: 15px;
        }

        /* Destaques e Avisos */
        .alerta {
            background-color: #FFF3CD;
            border-left: 8px solid #856404;
            padding: 15px;
            font-weight: bold;
            border-radius: 4px;
        }

        /* Botão de Ajuda de Grande Dimensão */
        .btn-ajuda {
            display: block;
            width: 100%;
            background-color: #28A745; /* Verde para ação positiva */
            color: #FFFFFF;
            text-align: center;
            text-decoration: none;
            font-size: 26px;
            font-weight: bold;
            padding: 20px;
            border-radius: 12px;
            margin-top: 30px;
            border: none;
        }

        .btn-ajuda:hover, .btn-ajuda:focus {
            background-color: #1E7E34;
            outline: 4px solid #FFD700; /* Destaque ao focar */
        }

        /* Rodapé */
        footer {
            text-align: center;
            margin-top: 40px;
            font-size: 18px;
            color: #555555;
        }
    </style>
